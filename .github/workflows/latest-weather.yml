name: Latest Weather Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  id-token: write
  contents: read

jobs:
  update-latest-weather:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # MICROSOFT ODBC DRIVER
      # ======================================================

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      # ======================================================
      # PYTHON DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # AZURE LOGIN USING OIDC
      # ======================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ======================================================
      # GET GITHUB RUNNER PUBLIC IP
      # ======================================================

      - name: Get GitHub runner IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP detected."
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      # ======================================================
      # TEMPORARILY OPEN AZURE SQL FIREWALL
      # ======================================================

      - name: Add temporary Azure SQL firewall rule
        run: |
          az sql server firewall-rule create \
            --resource-group rg-stockholm-weather \
            --server stockholm-weather-sql \
            --name GitHubActionsTemporary \
            --start-ip-address ${{ steps.runner-ip.outputs.ip }} \
            --end-ip-address ${{ steps.runner-ip.outputs.ip }}
           
      - name: Wait for Azure SQL firewall
        run: |
          echo "Waiting for Azure SQL firewall rule to propagate..."
          sleep 30       

      # ======================================================
      # RUN WEATHER PIPELINE
      # ======================================================

      - name: Run latest weather pipeline
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          python -m src.weather_pipeline.pipeline.run_latest_weather_pipeline

      # ======================================================
      # REMOVE TEMPORARY FIREWALL RULE
      # ======================================================

      - name: Remove temporary Azure SQL firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group rg-stockholm-weather \
            --server stockholm-weather-sql \
            --name GitHubActionsTemporary